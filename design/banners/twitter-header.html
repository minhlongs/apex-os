<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexOS Twitter Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0F172A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 1500px;
            height: 500px;
            position: relative;
            overflow: hidden;
            background: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 80% at 30% 50%, rgba(99, 102, 241, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse 60% 70% at 75% 45%, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
            z-index: 0;
        }

        .header::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 39px,
                rgba(99, 102, 241, 0.03) 39px,
                rgba(99, 102, 241, 0.03) 40px
            );
            z-index: 1;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
        }

        .glow--left {
            width: 500px;
            height: 500px;
            background: rgba(99, 102, 241, 0.2);
            top: -100px;
            left: -100px;
        }

        .glow--right {
            width: 450px;
            height: 450px;
            background: rgba(139, 92, 246, 0.15);
            bottom: -150px;
            right: 100px;
        }

        .geo-line {
            position: absolute;
            z-index: 1;
        }

        .geo-line--1 {
            width: 300px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.3), transparent);
            top: 80px;
            left: 10%;
        }

        .geo-line--2 {
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.25), transparent);
            bottom: 100px;
            right: 15%;
        }

        .geo-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #6366F1;
            border-radius: 50%;
            z-index: 1;
            opacity: 0.4;
        }

        .geo-dot--1 { top: 78px; left: 10%; }
        .geo-dot--2 { top: 78px; left: calc(10% + 300px); }
        .geo-dot--3 { bottom: 98px; right: calc(15% + 200px); }
        .geo-dot--4 { bottom: 98px; right: 15%; }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            position: relative;
        }

        .logo-icon::after {
            content: '';
            width: 22px;
            height: 22px;
            background: #FFFFFF;
            border-radius: 5px;
            transform: rotate(45deg);
            opacity: 0.9;
        }

        .logo-name {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #FFFFFF 0%, #A5B4FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            width: 1px;
            height: 50px;
            background: linear-gradient(180deg, transparent, rgba(99, 102, 241, 0.3), transparent);
            flex-shrink: 0;
        }

        .tagline {
            font-size: 22px;
            font-weight: 500;
            color: #94A3B8;
            letter-spacing: 0.01em;
            line-height: 1.3;
        }

        .tagline-accent {
            color: #C7D2FE;
            font-weight: 600;
        }

        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366F1 0%, #8B5CF6 40%, #06B6D4 70%, transparent 100%);
            opacity: 0.5;
            z-index: 10;
        }

        .corner-accent {
            position: absolute;
            width: 80px;
            height: 80px;
            z-index: 2;
            opacity: 0.15;
        }

        .corner-accent--tl {
            top: 30px;
            left: 30px;
            border-top: 2px solid #6366F1;
            border-left: 2px solid #6366F1;
        }

        .corner-accent--br {
            bottom: 30px;
            right: 30px;
            border-bottom: 2px solid #8B5CF6;
            border-right: 2px solid #8B5CF6;
        }

        /* Animated dots */
        .pulse-dots {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 2;
        }

        .pulse-dot {
            width: 4px;
            height: 4px;
            background: #6366F1;
            border-radius: 50%;
            opacity: 0.3;
            animation: pulseRow 1.5s ease-in-out infinite;
        }

        .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
        .pulse-dot:nth-child(3) { animation-delay: 0.4s; }
        .pulse-dot:nth-child(4) { animation-delay: 0.6s; }
        .pulse-dot:nth-child(5) { animation-delay: 0.8s; }

        @keyframes pulseRow {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="glow glow--left"></div>
        <div class="glow glow--right"></div>

        <div class="geo-line geo-line--1"></div>
        <div class="geo-line geo-line--2"></div>
        <div class="geo-dot geo-dot--1"></div>
        <div class="geo-dot geo-dot--2"></div>
        <div class="geo-dot geo-dot--3"></div>
        <div class="geo-dot geo-dot--4"></div>

        <div class="corner-accent corner-accent--tl"></div>
        <div class="corner-accent corner-accent--br"></div>

        <div class="pulse-dots">
            <div class="pulse-dot"></div>
            <div class="pulse-dot"></div>
            <div class="pulse-dot"></div>
            <div class="pulse-dot"></div>
            <div class="pulse-dot"></div>
        </div>

        <div class="content">
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-name">ApexOS</span>
            </div>
            <div class="divider"></div>
            <p class="tagline">
                <span class="tagline-accent">Crypto Cashback</span> + Affiliate Hub
            </p>
        </div>

        <div class="bottom-bar"></div>
    </div>
</body>
</html>
