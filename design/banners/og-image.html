<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexOS OG Image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0F172A;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .og-image {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            background: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .og-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 50%, rgba(99, 102, 241, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 80% 40%, rgba(139, 92, 246, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 50% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 60%);
            z-index: 0;
        }

        .og-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        .glow--1 {
            width: 500px;
            height: 500px;
            background: rgba(99, 102, 241, 0.3);
            top: -150px;
            left: -100px;
        }

        .glow--2 {
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.25);
            bottom: -120px;
            right: -80px;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 60px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            position: relative;
        }

        .logo-icon::after {
            content: '';
            width: 28px;
            height: 28px;
            background: #FFFFFF;
            border-radius: 6px;
            transform: rotate(45deg);
            opacity: 0.9;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #FFFFFF 0%, #A5B4FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 26px;
            font-weight: 500;
            color: #94A3B8;
            letter-spacing: 0.01em;
            line-height: 1.4;
        }

        .tagline-accent {
            color: #A5B4FC;
            font-weight: 600;
        }

        .bottom-bar {
            position: absolute;
            bottom: 40px;
            left: 60px;
            right: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .url-text {
            font-size: 14px;
            color: #64748B;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 100px;
            font-size: 13px;
            color: #A5B4FC;
            font-weight: 500;
        }

        .pill-dot {
            width: 6px;
            height: 6px;
            background: #6366F1;
            border-radius: 50%;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0); }
        }

        .deco-ring {
            position: absolute;
            width: 500px;
            height: 500px;
            border: 1px solid rgba(99, 102, 241, 0.08);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .deco-ring::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1px solid rgba(139, 92, 246, 0.06);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .top-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366F1 0%, #8B5CF6 50%, #06B6D4 100%);
            z-index: 10;
        }

        /* Floating accents */
        .floating-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);
            z-index: 2;
            animation: lineFloat 4s ease-in-out infinite;
        }

        .floating-line--1 {
            width: 200px;
            top: 180px;
            left: 80px;
            animation-delay: 0s;
        }

        .floating-line--2 {
            width: 150px;
            bottom: 200px;
            right: 100px;
            animation-delay: -2s;
        }

        @keyframes lineFloat {
            0%, 100% { opacity: 0.3; transform: translateX(0); }
            50% { opacity: 0.7; transform: translateX(10px); }
        }

        .corner-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #6366F1;
            border-radius: 50%;
            z-index: 2;
            opacity: 0.4;
        }

        .corner-dot--tl { top: 60px; left: 60px; }
        .corner-dot--tr { top: 60px; right: 60px; }
        .corner-dot--bl { bottom: 80px; left: 60px; }
        .corner-dot--br { bottom: 80px; right: 60px; }
    </style>
</head>
<body>
    <div class="og-image">
        <div class="top-line"></div>

        <div class="glow glow--1"></div>
        <div class="glow glow--2"></div>
        <div class="deco-ring"></div>

        <div class="floating-line floating-line--1"></div>
        <div class="floating-line floating-line--2"></div>
        <div class="corner-dot corner-dot--tl"></div>
        <div class="corner-dot corner-dot--tr"></div>
        <div class="corner-dot corner-dot--bl"></div>
        <div class="corner-dot corner-dot--br"></div>

        <div class="content">
            <div class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text">ApexOS</span>
            </div>
            <p class="tagline">
                Global Crypto <span class="tagline-accent">Cashback</span> + Affiliate Hub
            </p>
        </div>

        <div class="bottom-bar">
            <span class="url-text">apexos.io</span>
            <div class="pill">
                <span class="pill-dot"></span>
                Mainnet Live
            </div>
        </div>
    </div>
</body>
</html>
