name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 26.7.0 is the proven runtime: better-sqlite3 ships a native
      # binding compiled for Node 26's ABI, and `npm test` refuses to start
      # Jest on any other runtime rather than emitting hundreds of false
      # failures. Do not widen this without re-verifying the suite locally.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm install` rather than `npm ci`: this lockfile was generated by npm
      # but the tree was originally installed with pnpm (see CLAUDE.md), and the
      # two disagree about which optional and peer entries belong in the tree.
      # `npm ci` refuses to install that mismatch outright; `npm install`
      # resolves it and keeps the workflow green on the exact versions that
      # `npm ci --dry-run` validates locally.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
