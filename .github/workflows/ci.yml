name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 26.7.0 is the proven runtime: better-sqlite3 ships a native
      # binding compiled for Node 26's ABI, and `npm test` refuses to start
      # Jest on any other runtime rather than emitting hundreds of false
      # failures. Do not widen this without re-verifying the suite locally.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: package-lock.json

      # package-lock.json is the install path in CI. The tree was originally
      # installed with pnpm (see CLAUDE.md), and that lockfile had drifted
      # several devDependencies behind package.json, so `npm ci` refused to
      # install. It is regenerated here to match; switch CI to pnpm only after
      # doing the same on pnpm-lock.yaml.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
