name: CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/sprint4-email-automation-complete'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - 'feature/sprint4-email-automation-complete'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test & Worker Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: 'true'
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify staging D1 isolation
        run: bash scripts/assert-staging-isolation.sh

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run unit & integration tests
        run: CI=true npm test

      - name: Build Next.js + OpenNext Cloudflare Worker bundle
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build:worker
