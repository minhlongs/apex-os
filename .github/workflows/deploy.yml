name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy action to perform'
        required: true
        default: 'deploy-staging'
        type: choice
        options:
          - 'deploy-staging'
          - 'deploy-production'
          - 'rollback-staging'
          - 'rollback-production'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging (apex-os-staging)
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy-staging' || github.event.inputs.action == 'deploy-production'
    environment:
      name: staging
      url: https://apex-os-staging.agencyos-openclaw.workers.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/assert-cloudflare-credentials.sh

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert staging D1 isolation
        run: bash scripts/assert-staging-isolation.sh

      - name: Build Worker bundle
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build:worker

      - name: Deploy to Cloudflare Workers (Staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --config wrangler.staging.jsonc

      - name: Verify staging deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          STAGING_TARGET_URL: ${{ vars.STAGING_URL || 'https://apex-os-staging.agencyos-openclaw.workers.dev' }}
        run: bash scripts/verify-deployment.sh "${STAGING_TARGET_URL}" "${EXPECTED_SHA}"

  deploy-production:
    name: Deploy to Production (apex-os)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: |
      needs.deploy-staging.result == 'success' &&
      github.event.inputs.action == 'deploy-production' &&
      github.ref == 'refs/heads/master'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://apex-os.agencyos-openclaw.workers.dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release commit SHA matches staging
        run: |
          echo "Verifying deployment SHA alignment: ${{ github.sha }}"
          if [ -z "${{ github.sha }}" ]; then
            echo "ERROR: github.sha is empty, blocking production release."
            exit 1
          fi

      - name: Assert Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/assert-cloudflare-credentials.sh

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert staging isolation
        run: bash scripts/assert-staging-isolation.sh

      - name: Enforce strict economic go-live verdict (Production Blocker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Auditing Paper Trading economic go-live criteria..."
          bash scripts/go-live-gate.sh
          RUNS_JSON="$(./node_modules/.bin/wrangler d1 execute apex-os-staging-db --remote --config wrangler.staging.jsonc --command "SELECT * FROM paper_trading_runs WHERE is_active = 1" --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const p=JSON.parse(d);console.log(JSON.stringify(p[0]?.results||[]))}catch{console.log('[]')}})")"
          node scripts/verify-paper-economic-gate.cjs --runs-json "${RUNS_JSON}"

      - name: Build Worker bundle
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build:worker

      - name: Deploy to Cloudflare Workers (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --config wrangler.jsonc

      - name: Verify production deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_TARGET_URL: ${{ vars.PRODUCTION_URL || 'https://apex-os.agencyos-openclaw.workers.dev' }}
        run: bash scripts/verify-deployment.sh "${PRODUCTION_TARGET_URL}" "${EXPECTED_SHA}"

  rollback-staging:
    name: Rollback Staging (apex-os-staging)
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rollback-staging'
    environment:
      name: staging
      url: https://apex-os-staging.agencyos-openclaw.workers.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/assert-cloudflare-credentials.sh

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute staging rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler rollback --config wrangler.staging.jsonc -y

  rollback-production:
    name: Rollback Production (apex-os)
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action == 'rollback-production' &&
      github.ref == 'refs/heads/master'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://apex-os.agencyos-openclaw.workers.dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/assert-cloudflare-credentials.sh

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute production rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler rollback --config wrangler.jsonc -y
