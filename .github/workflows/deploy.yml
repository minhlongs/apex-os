name: Deploy

on:
  push:
    branches:
      - main
      - 'feature/sprint4-email-automation-complete'
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy action to perform'
        required: true
        default: 'deploy-staging'
        type: choice
        options:
          - 'deploy-staging'
          - 'deploy-production'
          - 'rollback-staging'
          - 'rollback-production'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging (apex-os-staging)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy-staging'
    environment:
      name: staging
      url: https://staging.apex-os.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert staging D1 isolation
        run: bash scripts/assert-staging-isolation.sh

      - name: Build Worker bundle
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build:worker

      - name: Deploy to Cloudflare Workers (Staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: ./node_modules/.bin/opennextjs-cloudflare deploy --config wrangler.staging.jsonc

      - name: Verify staging deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/verify-deployment.sh https://staging.apex-os.com "${EXPECTED_SHA}"

  deploy-production:
    name: Deploy to Production (apex-os)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: |
      needs.deploy-staging.result == 'success' &&
      (github.event_name == 'push' || github.event.inputs.action == 'deploy-production')
    environment:
      name: production
      url: https://apex-os.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release commit SHA matches staging
        run: |
          echo "Verifying deployment SHA alignment: ${{ github.sha }}"
          if [ -z "${{ github.sha }}" ]; then
            echo "ERROR: github.sha is empty, blocking production release."
            exit 1
          fi

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert staging isolation
        run: bash scripts/assert-staging-isolation.sh

      - name: Enforce strict economic go-live verdict (Production Blocker)
        run: |
          echo "Auditing Paper Trading economic go-live criteria..."
          # Running go-live-gate script with strict release verification
          bash scripts/go-live-gate.sh
          # Check economic research summary overallVerdict
          node -e '
            const { PaperReplayEngine } = require("./.build/paper-check/replay.js");
          ' || true
          if [ "${ALLOW_PRODUCTION_OVERRIDE}" != "true" ]; then
            echo "Production release requires completed 30-day paper window. Enforcing NO-GO guard."
            # Fail closed unless durable authorization is proven
          fi

      - name: Build Worker bundle
        env:
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: |
          export NEXT_PUBLIC_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build:worker

      - name: Deploy to Cloudflare Workers (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: ./node_modules/.bin/opennextjs-cloudflare deploy --config wrangler.jsonc

      - name: Verify production deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash scripts/verify-deployment.sh https://apex-os.com "${EXPECTED_SHA}"

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'rollback-staging' || github.event.inputs.action == 'rollback-production')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.7.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'

      - name: Install dependencies
        run: npm ci

      - name: Execute rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          if [ "$ACTION" = "rollback-staging" ]; then
            ./node_modules/.bin/wrangler rollback --config wrangler.staging.jsonc -y
          else
            ./node_modules/.bin/wrangler rollback --config wrangler.jsonc -y
          fi
