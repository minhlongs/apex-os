<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexOS Email Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #1E293B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .email-header {
            width: 600px;
            height: 200px;
            position: relative;
            overflow: hidden;
            background: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .email-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 100% at 0% 50%, rgba(99, 102, 241, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 100% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 50% 100%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
            z-index: 0;
        }

        .email-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 30px,
                rgba(99, 102, 241, 0.025) 30px,
                rgba(99, 102, 241, 0.025) 31px
            );
            z-index: 1;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .glow--left {
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.2);
            top: -80px;
            left: -60px;
        }

        .glow--right {
            width: 250px;
            height: 250px;
            background: rgba(139, 92, 246, 0.15);
            bottom: -80px;
            right: -40px;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 40px;
            width: 100%;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
            position: relative;
        }

        .logo-icon::after {
            content: '';
            width: 17px;
            height: 17px;
            background: #FFFFFF;
            border-radius: 4px;
            transform: rotate(45deg);
            opacity: 0.9;
        }

        .text-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #FFFFFF 0%, #C7D2FE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .tagline {
            font-size: 13px;
            font-weight: 500;
            color: #64748B;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .right-block {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 100px;
            font-size: 11px;
            color: #A5B4FC;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #6366F1;
            border-radius: 50%;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0); }
        }

        .bottom-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366F1 0%, #8B5CF6 50%, #06B6D4 100%);
            opacity: 0.5;
            z-index: 10;
        }

        .top-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 10%, rgba(99, 102, 241, 0.3) 50%, transparent 90%);
            z-index: 10;
        }

        /* Decorative ring accent */
        .ring-accent {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px solid rgba(99, 102, 241, 0.08);
            border-radius: 50%;
            top: -40px;
            right: 100px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="email-header">
        <div class="top-line"></div>

        <div class="glow glow--left"></div>
        <div class="glow glow--right"></div>

        <div class="ring-accent"></div>

        <div class="content">
            <div class="logo-icon"></div>
            <div class="text-block">
                <span class="brand-name">ApexOS</span>
                <span class="tagline">Crypto Cashback + Affiliate Hub</span>
            </div>
            <div class="right-block">
                <div class="status-pill">
                    <span class="status-dot"></span>
                    Mainnet
                </div>
            </div>
        </div>

        <div class="bottom-line"></div>
    </div>
</body>
</html>
